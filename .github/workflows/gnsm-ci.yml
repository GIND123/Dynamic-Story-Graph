name: GNSM CI

on:
  push:
    paths: ["gnsm/**", "tests/**", "pyproject.toml", ".github/workflows/gnsm-ci.yml"]
  pull_request:
    paths: ["gnsm/**", "tests/**", "pyproject.toml", ".github/workflows/gnsm-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check gnsm tests
      - run: python -m pytest
